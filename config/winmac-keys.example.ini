; =============================================================================
; WinMacKeys configuration
; Copy this file to:  %APPDATA%\WinMacKeys\config.ini
; (the installer does this for you on first install).
; Keep values ASCII. Lines starting with ; are comments.
; After editing, use the tray menu -> "Reload".
; =============================================================================

[language]
; Switch the input language with a single key.
enabled = true
; Key that triggers the switch (AutoHotkey key name). Default: CapsLock
hotkey = CapsLock
; How the switch is performed:
;   altshift  -> sends Left Alt+Shift   (Windows default language hotkey)
;   ctrlshift -> sends Ctrl+Shift
;   winspace  -> sends Win+Space        (shows the language popup)
method = altshift
; When the hotkey is CapsLock, keep the normal Caps Lock on Shift+CapsLock.
shift_toggles_capslock = true

[swap_ctrl_win]
; Swap Ctrl and Win to feel more like macOS.
;   off  -> no swap (recommended default; keeps Ctrl+C/V where you expect)
;   left -> swap only Left Ctrl <-> Left Win
;   full -> swap both sides
; NOTE: with a swap on, shortcuts like Ctrl+C move to the former Win key.
mode = off

[screenshot]
; Map a Mac-style chord to the Windows region screenshot (Win+Shift+S).
enabled = true
; Semicolon-separated list of AHK hotkeys. Examples:
;   ^+#4   -> Ctrl+Shift+Win+4  (matches a common Keychron Mac macro key)
;   #+4    -> Win+Shift+4
;   ^+4    -> Ctrl+Shift+4
hotkeys = ^+#4

[remap]
; Generic key remaps - one "from = to" per line (AutoHotkey key names).
; Uncomment to use:
;   CapsLock = Escape
;   RAlt = AppsKey

[run]
; Launch an app / file / URL by hotkey: "hotkey = command".
; ^=Ctrl !=Alt +=Shift #=Win. Uncomment to use:
;   #t = wt.exe
;   #e = explorer.exe
;   ^!c = https://www.google.com

[hyper]
; Turn one key into a Hyper modifier (Ctrl+Alt+Shift+Win), then bind hyper+<key>
; in [hyper_run]. Do NOT reuse the [language] key (CapsLock) here.
enabled = false
key = CapsLock

[hyper_run]
; hyper + <key> = command  (fires only while the hyper key is held). Uncomment:
;   e = explorer.exe
;   t = wt.exe

[mac_text_nav]
; macOS-style text navigation using the Win key as Cmd
; (Win+Left/Right = Home/End, Win+Up/Down = doc start/end, Alt+Left/Right = word).
; NOTE: this overrides Win+Arrow window snapping while enabled.
enabled = false
